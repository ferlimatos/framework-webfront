<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 4</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      #botoes-grid {
        display: flex;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Contador</h1>
      <p>{{ contador }}</p>
      <div id="botoes-grid">
        <button @click="diminuirNumero">Diminuir</button>
        <button @click="zerarNumero">Zerar</button>
        <button @click="aumentarNumero">Aumentar</button>
      </div>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        // É no setup() que você prepara a lógica e os tados do seu componente. Usa Composition API.
        setup() {
          const contador = ref(0); // Transforma o valor em um estado reativo. Se o valor mudar, será atualizado pelo Vue.

          function aumentarNumero() {
            contador.value++;
          }

          function diminuirNumero() {
            contador.value--;
          }

          function zerarNumero() {
            contador.value = 0;
          }

          return {
            contador,
            aumentarNumero,
            diminuirNumero,
            zerarNumero
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
