<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 9</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Tecnologias Front-End</h1>
      <input
        type="text"
        v-model="novaTecnologia"
        placeholder="Digite uma tecnologia"
      />
      <button @click="adicionarTecnologia">Adicionar</button>
      <ul>
        <li v-for="tecnologia in tecnologias" :key="tecnologia">
          {{ tecnologia }}
        </li>
      </ul>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const novaTecnologia = ref();

          const tecnologias = ref([]);

          function adicionarTecnologia() {
            tecnologias.value.push(novaTecnologia.value);
            novaTecnologia.value = "";
          }

          return {
            novaTecnologia,
            tecnologias,
            adicionarTecnologia,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
