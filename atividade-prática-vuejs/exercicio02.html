<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 2</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <p>Olá, meu nome é {{nome}}</p>
      <p>Eu estudo {{curso}}</p>
      <p>Moro em {{cidade}}</p>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        data() {
          return {
            nome: "Fernanda",
            curso: "Desenvolvimento Web e Mobile",
            cidade: "Goiânia",
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
