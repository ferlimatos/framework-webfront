<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 8</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Tecnologias Front-End</h1>
      <ul>
        <li v-for="tecnologia in tecnologias">{{ tecnologia }}</li>
      </ul>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const tecnologias = ref(["Vue", "React", "Angular", "Bootstrap"]);

          return {
            tecnologias,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
