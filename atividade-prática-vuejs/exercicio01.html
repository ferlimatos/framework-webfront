<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 1</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>{{ mensagem }}</h1>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        data() {
          return {
            mensagem: "Começando Vue.js",
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
