<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Mobile First */

        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .card {
            flex: 1;
            background-color: rgb(213, 178, 247);
            border: solid rgb(41, 5, 74) 1px;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            text-align: center;
        }

        @media (min-width: 768px) {
            main {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>
    <h1>Frameworks para Web Front-End </h1>
    <main>
        <div class="card">
            <h2>React</h2>
            <p>Biblioteca para construção de interfaces.</p>
        </div>
        <div class="card">
            <h2>Vue</h2>
            <p>Framework progressivo.</p>
        </div>
        <div class="card">
            <h2>Angular</h2>
            <p>Framework web.</p>
        </div>
    </main>
</body>

</html>
